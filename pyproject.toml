[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "tplink-easysmart-mcp"
version = "0.1.0"
description = "Local, browser-free MCP server for the TP-Link TL-SG1016PE Easy Smart PoE switch (read-first, write-gated, lockout-aware)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Ebenezer Isaac" }]
keywords = ["mcp", "tp-link", "easy-smart", "switch", "poe", "tl-sg1016pe"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: System :: Networking",
  "Topic :: System :: Networking :: Monitoring",
  "Topic :: Home Automation",
]
dependencies = [
  # FastMCP lives at mcp.server.fastmcp in the 1.x line; 2.x renamed it.
  "mcp>=1.12,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/ebenezer-isaac/tplink-easysmart-mcp"
Repository = "https://github.com/ebenezer-isaac/tplink-easysmart-mcp"
Issues = "https://github.com/ebenezer-isaac/tplink-easysmart-mcp/issues"
Changelog = "https://github.com/ebenezer-isaac/tplink-easysmart-mcp/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.5",
]

[project.scripts]
tplink-easysmart-mcp = "tplink_easysmart_mcp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["tplink_easysmart_mcp"]

[tool.hatch.build.targets.sdist]
include = ["tplink_easysmart_mcp", "tests", "scripts", "README.md", "LICENSE", ".env.example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["tplink_easysmart_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.isort]
# ``vigi_nvr_mcp`` is the canonical package name imported by the verbatim, hashed
# conformance test (and its test-only alias shim); treat it as first-party so ruff
# does not try to reorder that byte-identical file (which would break the identity test).
known-first-party = ["tplink_easysmart_mcp", "vigi_nvr_mcp"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S324", "S505"]
"scripts/**" = ["S603", "S607"]
